# A made-up example: every value here is invented. Copy it into your own nodes folder and replace them.
[global]
keyboard = "en-us"
country = "us"
fqdn = "node1.example.org"
mailto = "root@localhost"
timezone = "America/New_York"
# openssl passwd -6 example
root-password-hashed = "$6$QB0A8dqxpEEEg2zE$TZhPAU/MBLxySsrXwil/usdpBl1PV6xRgjYC57JPjgCz1PYNvoO3Mbg15YmJ9KekXt0TVZK7IXITUMALprdbF1"
root-ssh-keys = [ "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleExampleExampleExampleExampleExample01 example" ]
reboot-on-error = false

[network]
source = "from-answer"
cidr = "192.0.2.11/24"
dns = "192.0.2.1"
gateway = "192.0.2.1"
filter.ID_NET_NAME_MAC = "enx525400aabb01"

[disk-setup]
filesystem = "zfs"
zfs.raid = "raid0"
filter.ID_SERIAL = "EXAMPLEDISK01"

[first-boot]
source = "from-iso"
ordering = "before-network"
